name: End-to-end

# Rebuilds every result from the public sources and checks the README's claims
# against them. Separate from CI because it depends on CBOE and Yahoo being up.
on:
  push:
    branches: [main]
    paths: ["src/**", "sql/**", "pyproject.toml", ".github/workflows/e2e.yml"]
  schedule:
    - cron: "17 6 * * 1"   # Mondays, before the European open
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: sqlite:///data/volrv.db
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Ingest, build, backtest
        run: |
          volrv init-db
          volrv ingest --source all
          volrv build-features
          volrv report
      - name: Check the README's claims
        run: volrv check-claims
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: report
          path: reports/
