name: Record option chain

# Point-in-time by construction: one chain per trading day, appended forever.
on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC, shortly after the US close
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[postgres]"
      - name: Record
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          volrv init-db
          volrv snapshot --underlying SPY
          volrv audit-snapshots
